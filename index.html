<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сапер</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="cyberpunk-container">
        <header class="header">
            <div class="logo-container">
                <h1 class="logo-neon">Ramondrole</h1>
                <div class="logo-glow"></div>
            </div>
            
            <nav class="nav-controls">
                <a href="https://ramondrole.github.io/Pogreb_Ramondrole-Games/" class="cyber-btn back-btn">
                    <i class="fas fa-arrow-left"></i>
                    <span>Назад</span>
                </a>
                <button class="cyber-btn pause-btn" id="pauseBtn">
                    <i class="fas fa-pause"></i>
                    <span>Пауза</span>
                </button>
            </nav>
        </header>
        
        <main class="game-container">
            <div class="game-header">
                <div class="stats">
                    <div class="stat">
                        <span class="stat-label">МИНЫ</span>
                        <span class="stat-value" id="mineCount">10</span>
                    </div>
                    <div class="restart-btn" id="restartBtn">
                        <div class="face" id="face">😎</div>
                    </div>
                    <div class="stat">
                        <span class="stat-label">ВРЕМЯ</span>
                        <span class="stat-value" id="timer">000</span>
                    </div>
                </div>
                
                <div class="difficulty">
                    <button class="diff-btn active" data-difficulty="easy">НОВИЧОК</button>
                    <button class="diff-btn" data-difficulty="medium">ЛЮБИТЕЛЬ</button>
                    <button class="diff-btn" data-difficulty="hard">ЭКСПЕРТ</button>
                </div>
            </div>
            
            <div class="game-board" id="gameBoard"></div>
            
            <div class="game-info">
                <div class="info-box">
                    <h3><i class="fas fa-gamepad"></i> УПРАВЛЕНИЕ</h3>
                    <p>ЛКМ - открыть клетку</p>
                    <p>ПКМ - поставить флаг</p>
                    <p>Средняя кнопка - вопрос</p>
                </div>
                
                <div class="info-box">
                    <h3><i class="fas fa-crosshairs"></i> ЦЕЛЬ</h3>
                    <p>Откройте все клетки, не содержащие мины</p>
                    <p>Используйте цифры для определения мин</p>
                </div>
            </div>
        </main>
        
        <div class="pause-overlay" id="pauseOverlay">
            <div class="pause-content">
                <h2>ИГРА НА ПАУЗЕ</h2>
                <div class="pause-time">Время: <span id="pauseTimer">000</span></div>
                <button class="cyber-btn resume-btn" id="resumeBtn">
                    <i class="fas fa-play"></i>
                    <span>Продолжить</span>
                </button>
            </div>
        </div>
        
        <footer class="footer">
            <p>Сапер | Ramondrole</p>
            <p>Используйте флаги чтобы пометить мины</p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
